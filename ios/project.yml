name: PocketEurocrat
options:
  bundleIdPrefix: com.pro7ocol
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: H6MBTUJ4TQ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Config flip: "mock" = fixture backend (no server), "live" = https://eurocrat.pro7ocol.com
    ROAST_BACKEND: live   # server-v2 is live at eurocrat.pro7ocol.com; "mock" = offline fixtures
    ROAST_BASE_URL: https://eurocrat.pro7ocol.com
targets:
  PocketEurocrat:
    type: application
    platform: iOS
    sources: [PocketEurocrat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pro7ocol.eurocrat
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: PocketEurocrat/Info.plist
      properties:
        CFBundleDisplayName: Eurocrat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Hold the button to dictate your pitch to the Eurocrat.
        NSCameraUsageDescription: Your founder photo goes on the Commission's file (and the leaderboard).
        ITSAppUsesNonExemptEncryption: false
        RoastBackend: $(ROAST_BACKEND)
        RoastBaseURL: $(ROAST_BASE_URL)
  PocketEurocratTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PocketEurocratTests]
    dependencies:
      - target: PocketEurocrat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.pro7ocol.eurocrat.tests
