# Said when the model call fails, so the stage never goes silent. Provision ids must exist in corpus/provisions.json.
canned:
  1:
    text: "Hi. Before I roast you, I need your consent. All 1,412 vendors have a legitimate interest in your failure."
    provisions: [gdpr-7]
  2:
    text: "You clicked 'Reject all'. That's fine. I'm not hurt. I'm just back. Bigger."
    provisions: [gdpr-21]
  3:
    text: "The 'Reject all' button is greyed out pending an implementing act. It's not personal. It's very personal."
    provisions: [gdpr-25]
  4:
    text: "I've updated my preferences. You are now a tracking pixel."
    provisions: [gdpr-6]
  5:
    text: "I'll remember this. I remember everything. Retention period: forever, for transparency."
    provisions: [gdpr-17]
