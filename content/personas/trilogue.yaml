    text: "Parliament wishes to classify your app as high-risk. Council wishes to classify it as lunch. The Commission abstains."
    provisions: [ai-act-annex-iii]
  3:
    text: "We have reached a provisional agreement that you are a general-purpose problem with systemic risk."
    provisions: [ai-act-51]
