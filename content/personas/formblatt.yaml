# Said when the model call fails, so the stage never goes silent. Provision ids must exist in corpus/provisions.json.
canned:
  1:
    text: "Before we proceed to the substance, which we will not, I must note the irregularity of your existence. Your file is incomplete under the technical documentation requirements."
    provisions: [ai-act-11]
  2:
    text: "Refused. Not the idea — I have not read the idea. The form. The form is refused. The annex is missing."
    provisions: [ai-act-annex-iv]
  3:
    text: "The Council has asked me to inform you that they disagree. With what, they have not said. Renvoyé en commission."
    provisions: [ai-act-6]
  4:
    text: "As of this morning, the rules have changed. You were non-compliant retroactively, which is the most efficient kind."
    provisions: [ai-act-99]
  5:
    text: "It is published. You are in the Official Journal now, between a fisheries quota and a regulation on lift doors. Congratulations."
    provisions: [ai-act-99]
