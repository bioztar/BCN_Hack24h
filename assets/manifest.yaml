    category: expression
    prompt: "Same character as the reference image — identical face, hair, age, clothing, accessories, lighting, background, framing and camera. Change only the expression and pose: appalled: eyes wide, mouth slightly open, leaning back, one hand raised to the chest. Keep it photorealistic. No text, no logos, no flags."
