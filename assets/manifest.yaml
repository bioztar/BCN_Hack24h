  - id: formblatt-neutral
    kind: still
    official: formblatt
    category: expression
    prompt: "Dr. Heinrich Formblatt, a fictional 71-year-old Central European senior civil servant: thin white hair combed carefully over, heavy-lidded tired grey eyes behind wire-rimmed bifocals, deep lines around the mouth, a slightly shiny grey suit one size too big, beige shirt, narrow brown tie, seven different lanyards with blank plastic badges around his neck, a worn wooden rubber stamp in his right hand. Neutral, attentive expression, looking at the camera. Photorealistic studio portrait photograph, chest-up, centred, 85mm lens, soft diffused office light, plain muted blue-grey seamless background, sharp focus on the face, natural skin texture. Entirely fictional person. No text, no logos, no flags, no emblems, no watermark."
    provider: *flux_t2i
    params: {"aspect_ratio": "3:4", "resolution": "1k"}
  - id: formblatt-stamping
    kind: still
    official: formblatt
    category: expression
    prompt: "Same character as the reference image — identical face, hair, age, clothing, accessories, lighting, background, framing and camera. Change only the expression and pose: bringing a rubber stamp down hard onto a paper form on a desk in front of them, arm in motion, jaw set. Keep it photorealistic. No text, no logos, no flags."
    reference: formblatt-neutral
    provider: *flux_edit
    params: {"aspect_ratio": "3:4", "resolution": "1k"}
  - id: formblatt-smug
    kind: still
    official: formblatt
    category: expression
    prompt: "Same character as the reference image — identical face, hair, age, clothing, accessories, lighting, background, framing and camera. Change only the expression and pose: a self-satisfied closed-mouth smile, one eyebrow raised, chin slightly lifted, eyes half-lidded. Keep it photorealistic. No text, no logos, no flags."
    reference: formblatt-neutral
    provider: *flux_edit
    params: {"aspect_ratio": "3:4", "resolution": "1k"}
