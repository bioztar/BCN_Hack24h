# DG ROAST asset manifest — read by tools/assetgen. Edit here; outputs go to assets/generated/<dir>/<id>.<ext>.
# Prices: observed on fal.ai/models/<id>/llms.txt and docs.slng.ai on 2026-10-09 (list prices, not promos). See tools/assetgen/README.md.
version: 1

providers:
  flux_t2i: &flux_t2i {provider: fal, model: blackforestlabs/flux-3/text-to-image, unit: image, unit_cost_usd: 0.048}
  flux_edit: &flux_edit {provider: fal, model: blackforestlabs/flux-3/edit-image, unit: image, unit_cost_usd: 0.048}
  trellis: &trellis {provider: fal, model: fal-ai/trellis, unit: generation, unit_cost_usd: 0.02}
  h3_turbo: &h3_turbo {provider: fal, model: minimax/h3-max-turbo/image-to-video, unit: second, unit_cost_usd: 0.04}
  lipsync: &lipsync {provider: fal, model: fal-ai/sync-lipsync/v3/image-to-video, unit: second, unit_cost_usd: 0.1333}
  fish: &fish {provider: slng, model: slng/fish/tts:s2.1-pro, unit: minute, unit_cost_usd: 0.005}

# Voice keys. `formblatt` / `annexe` / `council` are the defaults the speaking clips use (first pick in content/voices.md).
voices:
  formblatt: {<<: *fish, voice_id: 79d0bd3e4e5444b18f7b6d89b5927bf1, speed: 0.8}  # Fish stock voice 'Jordan'
  formblatt-alt-adrian: {<<: *fish, voice_id: bf322df2096a46f18c579d0baa36f41d, speed: 0.8}  # Fish stock voice 'Adrian'
  formblatt-alt-richard: {<<: *fish, voice_id: fbc1029c018041d4b17f2c1e57222dff, speed: 0.8}  # Fish stock voice 'Richard'
  annexe: {<<: *fish, voice_id: e3cd384158934cc9a01029cd7d278634, speed: 0.92}  # Fish stock voice 'Laura'
  annexe-alt-selene: {<<: *fish, voice_id: b347db033a6549378b48d00acb0d06cd, speed: 0.92}  # Fish stock voice 'Selene'
  annexe-alt-carol: {provider: slng, model: cartesia/sonic:3, unit: minute, unit_cost_usd: 0.035, voice_id: bf991597-6c13-47e4-8411-91ec2de5c466}  # Cartesia 'Carol'
  formblatt-alt-alaric: {provider: slng, model: cartesia/sonic:3, unit: minute, unit_cost_usd: 0.035, voice_id: 87748186-23bb-4158-a1eb-332911b0b708}  # Cartesia 'Alaric'
  council: {provider: slng, model: deepgram/aura:2, unit: minute, unit_cost_usd: 0.005, voice_id: aura-2-zeus-en}  # Deepgram Aura-2 'Zeus'

