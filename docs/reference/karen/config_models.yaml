# Which Nebius models Karen uses. Every id is from Nebius Token Factory
# (https://api.studio.nebius.com/v1), auth: NEBIUS_API_KEY.
#
# Chosen by bake-off, 2026-09-20, five candidates x three provocations on the real
# persona prompt, scored on stays-in-character / never-refuses / latency:
#   moonshotai/Kimi-K3          3/3 in character, ~2.2 s, sharpest writing   <- primary
#   deepseek-ai/DeepSeek-V4-Pro 3/3 in character, ~1.7 s, slightly blunter   <- fallback
#   nvidia/Nemotron-3-Ultra     REFUSED 1/3 ("I'm not going to roleplay an abusive
#                               character") - disqualified, a refusal kills the joke
#   zai-org/GLM-5.3             returned empty content on every call (reasoning model,
#                               spends the whole budget thinking) - unusable here
#   Qwen/Qwen3.5-397B-A17B      returned empty content on every call - unusable here
#
# Re-measured 2026-09-23, hours before the live demo: Kimi-K3 took 61.9 s on a single
# turn against a 20 s timeout, so every turn fell to the fallback. Same day on Nebius:
#   deepseek-ai/DeepSeek-V4-Pro            660 ms   <- primary (was the fallback)
#   Qwen/Qwen3-235B-A22B-Instruct-2507     394 ms   <- fallback (instruct-only, no thinking)
# timeoutMs dropped to 8 s so a slow primary hands over before the visitor notices.
#
# thinking MUST stay false. DeepSeek is a hybrid reasoning model and returns an empty
# `content` with the budget burned in `reasoning_content` when it is on. The Qwen instruct
# model has no thinking mode; it ignores the kwarg, so the flag stays on both profiles.

profiles:
  # Karen's reply. Short, savage, streamed to the browser token by token.
  karen:
    model: deepseek-ai/DeepSeek-V4-Pro
    fallback: Qwen/Qwen3-235B-A22B-Instruct-2507
    temperature: 1.0
    maxOutputTokens: 220
    timeoutMs: 8000
    # presence/frequency penalties are the anti-vanilla dial: they stop her reaching for
    # the same pet name and the same shape of insult every turn. See docs/PERSONA.md -> The pinch.
    extraBody:
      chat_template_kwargs: { thinking: false }
      presence_penalty: 0.7
      frequency_penalty: 0.4

  # The manager persona at rage tier 5. Colder, more corporate, takes Karen's side.
  manager:
    model: deepseek-ai/DeepSeek-V4-Pro
    fallback: Qwen/Qwen3-235B-A22B-Instruct-2507
    temperature: 0.8
    maxOutputTokens: 200
    timeoutMs: 8000
    extraBody: { chat_template_kwargs: { thinking: false } }

  # Picks the single nastiest sentence of a reply for the wall of shame + receipt card.
  # Off the live path. Cheap model, terse output.
  pick:
    model: deepseek-ai/DeepSeek-V4.1-Flash
    temperature: 0
    maxOutputTokens: 120
    timeoutMs: 8000
    extraBody: { chat_template_kwargs: { thinking: false } }

  # Karen Live's scene director: where the next video chunk cuts to. Same cheap model as
  # `pick`, ~1 s budget — the route falls back to a preset location when this is late.
  scene:
    model: deepseek-ai/DeepSeek-V4.1-Flash
    temperature: 1.1
    maxOutputTokens: 160
    timeoutMs: 1200
    extraBody: { chat_template_kwargs: { thinking: false } }

# USD per 1M tokens (Nebius catalog, Sept 2026). Used for the cost line in the log.
prices:
  moonshotai/Kimi-K3: { input: 0.60, output: 2.50 }
  deepseek-ai/DeepSeek-V4-Pro: { input: 1.80, output: 7.20 }
  # Estimate, not yet checked against the catalog; nothing reads this map today.
  Qwen/Qwen3-235B-A22B-Instruct-2507: { input: 0.20, output: 0.60 }
  deepseek-ai/DeepSeek-V4.1-Flash: { input: 0.30, output: 1.20 }
